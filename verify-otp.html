<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your FindBack account with a six-digit email code.">
    <title>FindBack | Verify Email</title>
    <link rel="icon" type="image/png" href="images/spy-favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="verifyTitle">
            <img src="images/FindBack-Logo.png" alt="FindBack Logo">
            <h1 id="verifyTitle">Verify your email</h1>
            <p>Enter the six-digit code sent to your email address.</p>
            <form id="verifyOtpForm">
                <label for="verifyEmail">Email address</label>
                <input id="verifyEmail" type="email" autocomplete="email" required>
                <fieldset class="otp-fieldset">
                    <legend>Six-digit verification code</legend>
                    <div class="otp-inputs" role="group" aria-label="Six-digit verification code">
                        <input class="otp-digit" aria-label="Digit 1" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]" maxlength="6" required>
                        <input class="otp-digit" aria-label="Digit 2" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required>
                        <input class="otp-digit" aria-label="Digit 3" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required>
                        <input class="otp-digit" aria-label="Digit 4" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required>
                        <input class="otp-digit" aria-label="Digit 5" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required>
                        <input class="otp-digit" aria-label="Digit 6" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required>
                    </div>
                </fieldset>
                <p id="otpCountdown" class="reset-help" aria-live="polite"></p>
                <p id="verifyOtpMessage" class="reset-status" role="status" aria-live="polite"></p>
                <button id="verifyOtpButton" type="submit">Verify Email</button>
                <button id="resendOtpButton" class="secondary-auth-button" type="button" disabled>Resend Code</button>
            </form>
            <p class="auth-footer"><a href="sign-up.html">Back to sign up</a> · <a href="login.html">Sign in</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/profile-photo.js"></script>
    <script src="js/verify-otp.js"></script>
</body>
</html>
