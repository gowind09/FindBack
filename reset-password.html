<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your FindBack password.">
    <title>FindBack | Reset Password</title>
    <link rel="icon" type="image/png" href="images/spy-favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="resetTitle">
            <a href="index.html"><img src="images/FindBack-Logo.png" alt="FindBack Logo"></a>
            <h1 id="resetTitle">Reset your password</h1>
            <form id="recoveryRequestForm">
                <p>Enter your account email and we’ll send you a password reset link.</p>
                <label for="recoveryEmail">Email</label>
                <input id="recoveryEmail" type="email" autocomplete="email" placeholder="Enter your email" required>
                <button id="recoveryRequestBtn" type="submit">Send reset link</button>
            </form>
            <form id="recoveryUpdateForm" hidden>
                <p>Choose a new password for your account.</p>
                <label for="newPassword">New password</label>
                <div class="password-input-wrap">
                    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
                    <button class="password-toggle" type="button" data-target="newPassword" aria-pressed="false">Show</button>
                </div>
                <label for="confirmNewPassword">Confirm password</label>
                <div class="password-input-wrap">
                    <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again" required>
                    <button class="password-toggle" type="button" data-target="confirmNewPassword" aria-pressed="false">Show</button>
                </div>
                <button id="recoveryUpdateBtn" type="submit">Update password</button>
            </form>
            <p id="recoveryMessage" class="reset-status" role="status" aria-live="polite"></p>
            <p class="auth-footer"><a href="login.html">Back to sign in</a></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
